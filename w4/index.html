<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friends' Messages | 動態留言牆</title>
  
  <!-- 導入歐美視覺風格常用的高級字型 (Playfair Display 襯線體 + Montserrat 無襯線體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 全局變數定義 (方便你後續修改顏色與風格)
       ========================================================================== */
    :root {
      /* 【顏色控制區】 */
      --bg-color: #0d0f12;           /* 主背景色：深邃暗黑 */
      --card-bg: #161a20;            /* 卡片背景色：暗灰 */
      --text-main: #f3f4f6;          /* 主文字顏色：冷白 */
      --text-muted: #9ca3af;         /* 次要文字/時間顏色：灰 */
      --accent-gold: #d4af37;        /* 亮點配色：歐美香檳金 */
      
      /* 【輪播亮起特效控制區】 */
      --highlight-glow: rgba(212, 175, 55, 0.4); /* 高亮時的發光顏色 (金黃色半透明) */
      --highlight-border: #d4af37;              /* 高亮時的邊框顏色 */
      --dim-opacity: 0.35;                      /* 未選中卡片的透明度 (0 ~ 1) */
      --dim-blur: 2px;                          /* 未選中卡片的模糊程度 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. 頁首與標題視覺 (歐美雜誌風格 Editorial Style)
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 1rem 0;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ==========================================================================
       3. 載入中酷炫動畫 (Loading Spinner)
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent-gold);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1.5rem;
    }

    #loading p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-size: 1.1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================================================
       4. 瀑布流排版 (Masonry Layout via CSS Columns)
       ========================================================================== */
    .masonry-grid {
      /* RWD 多欄位瀑布流設定 */
      column-count: 3;        /* 桌機預設 3 欄 */
      column-gap: 1.5rem;     /* 欄位間距 */
      display: none;          /* 載入完成前先隱藏 */
    }

    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; } /* 平板 2 欄 */
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; } /* 手機 1 欄 */
    }

    /* ==========================================================================
       5. 留言卡片基礎與高亮特效樣式
       ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 關鍵：防止卡片在瀑布流跨欄斷裂 */
      position: relative;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      
      /* 動態平滑轉場效果 (對放大、發光、透明度變化起作用) */
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }

    /* 引號裝飾圖案 */
    .card::before {
      content: '“';
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      position: absolute;
      top: -10px;
      left: 15px;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8rem;
    }

    .card-author {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-main);
      white-space: pre-wrap; /* 保持原本留言的換行格式 */
      word-break: break-word;
    }

    /* ---【重點特效】輪播動態狀態 --- */

    /* A. 被選中的卡片：放大、亮起、發光 */
    .card.highlight {
      transform: scale(1.05);
      border-color: var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-glow), 0 15px 30px rgba(0,0,0,0.5);
      z-index: 10; /* 確保高亮的卡片壓在最上層 */
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* B. 未被選中的卡片 (當有其他卡片被高亮時套用) */
    .masonry-grid.is-highlighting .card:not(.highlight) {
      opacity: var(--dim-opacity);
      filter: blur(var(--dim-blur));
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Friends' Words</h1>
      <p>— Dynamic Wall of Memories —</p>
    </header>

    <!-- 載入中酷炫動畫 -->
    <div id="loading">
      <div class="spinner"></div>
      <p>載入留言中...</p>
    </div>

    <!-- 留言瀑布流區域 -->
    <div id="masonry" class="masonry-grid"></div>
  </div>

  <script>
    /* ==========================================================================
       6. 參數設定區 (方便你控制輪播秒數與資料來源)
       ========================================================================== */
    const CONFIG = {
      // CSV 資料來源網址
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNqce7Hp5JM0bG8mcLq_bw2guUo7Kc1HgLdSloLMQ6sfpc6lkNldbM2t6i_r7Kf3Tt1WXy1RPJpoiC/pub?output=csv',
      
      // 【輪播秒數控制】單位為毫秒 (3000ms = 3 秒)
      rotateInterval: 3000 
    };

    let messages = [];
    let currentIndex = -1;
    let highlightTimer = null;

    /* ==========================================================================
       7. CSV 解析器 (妥善處理留言內部包含逗號及雙引號換行的情況)
       ========================================================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            entry += '"'; // 處理雙重引號轉義
            i++;
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') { i++; }
          row.push(entry.trim());
          if (row.some(field => field.length > 0)) {
            lines.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }
      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }
      return lines;
    }

    /* ==========================================================================
       8. 繪製 HTML 卡片牆
       ========================================================================== */
    function renderCards(data) {
      const container = document.getElementById('masonry');
      container.innerHTML = '';

      // 跳過 CSV 第一行 (標頭檔: 時間戳記, 名字, 悄悄話)
      const rows = data.slice(1);

      rows.forEach((row, index) => {
        // 欄位拆解：欄位 0 為時間戳記、欄位 1 為名字、欄位 2 為留言內容
        const rawTime = row[0] || '';
        const name = row[1] || 'Anonymous';
        const message = row[2] || '';

        if (!message) return; // 無內容則忽略

        // 簡單格式化時間顯示 (只保留日期)
        const timeFormatted = rawTime.split(' ')[0] || rawTime;

        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHtml(name)}</span>
            <span class="card-time">${escapeHtml(timeFormatted)}</span>
          </div>
          <div class="card-content">${escapeHtml(message)}</div>
        `;

        container.appendChild(card);
      });
    }

    // 防止 XSS 攻擊的字串安全轉換
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* ==========================================================================
       9. 隨時間輪播高亮特效控制 (Highlight Carousel)
       ========================================================================== */
    function startHighlightCarousel() {
      const cards = document.querySelectorAll('.card');
      const grid = document.getElementById('masonry');

      if (cards.length === 0) return;

      // 標記網頁處於輪播狀態，讓 CSS 生效未選中的變暗/模糊效果
      grid.classList.add('is-highlighting');

      highlightTimer = setInterval(() => {
        // 1. 移除上一張卡片的高亮
        if (currentIndex >= 0 && cards[currentIndex]) {
          cards[currentIndex].classList.remove('highlight');
        }

        // 2. 計算下一個要高亮的索引 (循環播放)
        currentIndex = (currentIndex + 1) % cards.length;

        // 3. 賦予當前卡片高亮 Class
        const currentCard = cards[currentIndex];
        currentCard.classList.add('highlight');

        // 4. (可選) 視窗平滑滾動至該卡片位置
        currentCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });

      }, CONFIG.rotateInterval); // 每隔指定秒數切換一次
    }

    /* ==========================================================================
       10. 初始化與資料讀取 (Fetch Data)
       ========================================================================== */
    async function init() {
      const loadingEl = document.getElementById('loading');
      const masonryEl = document.getElementById('masonry');

      try {
        // 從 Google 試算表獲取 CSV
        const response = await fetch(CONFIG.csvUrl);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 隱藏 Loading，顯示留言牆
        loadingEl.style.display = 'none';
        masonryEl.style.display = 'block';

        // 生成卡片並啟動輪播特效
        renderCards(parsedData);
        startHighlightCarousel();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = `<p style="color: #ef4444;">無法載入留言，請確認網路連線或網址設定。</p>`;
      }
    }

    // 頁面載入後自動執行
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
